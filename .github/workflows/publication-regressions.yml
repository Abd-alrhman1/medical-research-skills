name: Verify publication fixes
on:
  pull_request:
    paths:
      - 'scientific-skills/Other/resubmission-deadline-tracker/**'
      - 'scientific-skills/Evidence Insight/citation-network/**'
      - 'scientific-skills/Other/slide-deck-images/**'
      - 'tests/publication_regressions.py'
      - '.github/workflows/publication-regressions.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  regression:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.10'
      - run: python -m pip install -r scientific-skills/Other/resubmission-deadline-tracker/requirements.txt
      - run: python tests/publication_regressions.py
